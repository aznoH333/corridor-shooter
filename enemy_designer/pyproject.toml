[project]
name = "enemy-designer"
version = "0.1.0"
description = "Desktop tool for authoring enemy parts and enemies for corridor-shooter"
requires-python = ">=3.10"
dependencies = [
    "dearpygui>=1.11,<3",
    "Pillow>=10,<12",
]

[project.scripts]
enemy-designer = "src.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
